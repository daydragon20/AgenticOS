SH.creek=`
#define MAXSTEP 116
#define MAXDIST 45.0
#define WY 0.0
float chanX(float z){ return 0.9*sin(z*0.16)+0.35*sin(z*0.42+1.3); }
float bedH(vec2 x){
  float c=chanX(x.y);
  float w=1.30+0.30*sin(x.y*0.3);
  float ch=-0.40*exp(-pow((x.x-c)/w,2.0));
  float bank=0.50*fbm2(x*0.28)+0.16*fbm2(x*0.9);
  return ch+bank*0.55+0.02*fbm2(x*3.5);
}
float waveH(vec2 w){
  return 0.030*fbm2(w*vec2(2.4,1.3)+vec2(0.0,-T*1.15))+0.013*vn2(w*vec2(8.0,3.4)+vec2(0.0,-T*2.4));
}
float MAP(vec3 p, out float mid){
  mid=1.0;
  float d=(p.y-bedH(p.xz))*0.6;
  float wat=(p.y-(WY+waveH(p.xz)*0.4))*0.8;
  if(wat<d){ d=wat; mid=30.0; }
  for(int i=0;i<6;i++){
    float fi=float(i);
    float z=-4.5+fi*1.6+0.5*h11(fi*3.7);
    float x=chanX(z)+0.55*(h11(fi*5.3)-0.5);
    vec3 c=vec3(x, WY-0.075+0.06*h11(fi*7.1), z);
    float r=0.095+0.065*h11(fi*11.3);
    float st=sdSph((p-c)/vec3(1.0,0.62,1.0), r)*0.62 - 0.028*fbm3(p*12.0);
    if(st<d){ d=st; mid=5.0; }
  }
  vec3 tq=p; tq.z=mod(p.z+1.6,3.2)-1.6;
  float side=(p.x>0.0)?1.0:-1.0;
  float tx=chanX(p.z)+side*(2.3+0.7*h11(floor((p.z+1.6)/3.2)*2.3+(side>0.0?0.0:9.0)));
  float trunk=sdCap(vec3(tq.x-tx,tq.y,tq.z), vec3(0.0), vec3(0.10*side,2.85,0.0), 0.080);
  if(trunk<d){ d=trunk; mid=6.0; }
  float can=sdSph(vec3(tq.x-tx,tq.y-3.20,tq.z)/vec3(1.0,0.78,1.0),1.35)*0.78 - 0.30*fbm3(p*1.7);
  if(can<d){ d=can; mid=7.0; }
  for(int i=0;i<8;i++){
    float fi=float(i);
    float z=-2.6+fi*0.7;
    float sgn=(mod(fi,2.0)<1.0)?1.0:-1.0;
    float x=chanX(z)+sgn*(1.35+0.30*h11(fi*3.1));
    vec3 a=vec3(x, bedH(vec2(x,z))-0.05, z);
    vec3 b=a+vec3(0.10*sin(T*0.7+fi), 0.55+0.25*h11(fi*5.1), 0.05);
    float r2=sdCap(p,a,b,0.010);
    if(r2<d){ d=r2; mid=4.0; }
  }
  float hm;
  float hz=-1.15, hx=chanX(hz)+1.45;
  float hu=human(p-vec3(hx, bedH(vec2(hx,hz))-0.03, hz), 3.0, T, 1.0, hm);
  if(hu<d){ d=hu; mid=hm; }
  return d;
}
vec3 sunC(){ return normalize(vec3(0.35,0.42,-0.84)); }
vec3 SKY(vec3 rd){
  float el=sat(rd.y*0.5+0.5);
  vec3 c=mix(vec3(0.30,0.36,0.30), vec3(0.20,0.34,0.54), pow(el,0.7));
  float sd=sat(dot(rd,sunC()));
  c+=vec3(1.5,1.20,0.75)*pow(sd,600.0)*3.0;
  c+=vec3(1.0,0.86,0.5)*pow(sd,20.0)*0.32;
  float leaf=fbm2(rd.xz/max(0.12,abs(rd.y))*1.6+vec2(T*0.02,0.0));
  c=mix(c, vec3(0.050,0.095,0.042), sat(rd.y*2.2)*sat(leaf*1.5-0.35)*0.92);
  return c;
}
vec3 REFL(vec3 ro, vec3 rd){
  float t=0.06,mid=0.0; bool hit=false;
  for(int i=0;i<40;i++){
    vec3 p=ro+rd*t; float d=MAP(p,mid);
    if(mid>29.5&&mid<30.5) d=max(d,0.03);
    if(d<0.005*max(t,1.0)){ hit=true; break; }
    t+=d*0.95; if(t>14.0) break;
  }
  if(!hit) return SKY(rd);
  vec3 p=ro+rd*t, n=NRM(p);
  vec3 alb=(mid<1.5)? vec3(0.09,0.12,0.055) : ((mid<5.5)? vec3(0.13,0.12,0.11) :
           ((mid<6.5)? vec3(0.09,0.075,0.055) : ((mid<7.5)? vec3(0.055,0.10,0.038) :
           ((mid<20.5)? vec3(0.10,0.11,0.14) : vec3(0.40,0.28,0.24)))));
  return alb*(sat(dot(n,sunC()))*0.85+0.35)*vec3(1.25,1.10,0.85);
}
vec3 SHADE(vec3 p, vec3 n, vec3 rd, float mid, float t){
  vec3 L=sunC(), LC=vec3(1.50,1.24,0.82), v=-rd;
  if(mid>29.5&&mid<30.5){
    float e=0.03;
    float H0=waveH(p.xz), Hx=waveH(p.xz+vec2(e,0.0)), Hz=waveH(p.xz+vec2(0.0,e));
    vec3 wn=normalize(vec3(-(Hx-H0)/e, 1.0, -(Hz-H0)/e));
    float fres=pow(sat(1.0-dot(wn,v)),4.5)*0.72+0.05;
    vec3 refl=REFL(p+wn*0.03, reflect(rd,wn));
    float depth=max(0.02, WY-bedH(p.xz));
    vec3 bedc=mix(vec3(0.15,0.125,0.085), vec3(0.30,0.26,0.18), fbm2(p.xz*5.0));
    float caus=pow(sat(1.0-abs(fbm2(p.xz*vec2(3.0,2.0)+vec2(H0*8.0,-T*1.0))*2.0-1.0)),4.0);
    bedc+=vec3(1.15,1.05,0.72)*caus*0.35*exp(-depth*3.0);
    vec3 through=mix(bedc, vec3(0.055,0.095,0.085), sat(depth*1.7));
    vec3 c=mix(through, refl, fres);
    c+=spec(wn,L,v,LC,0.05,1.5,1.0);
    float foam=0.0;
    for(int i=0;i<6;i++){
      float fi=float(i);
      float z=-4.5+fi*1.6+0.5*h11(fi*3.7);
      float x=chanX(z)+0.55*(h11(fi*5.3)-0.5);
      float r=0.115+0.065*h11(fi*11.3);
      vec2 dv=p.xz-vec2(x,z);
      float wake=sat(1.0-abs(dv.x)/(r*2.2))*sstep(0.0,r*3.0,dv.y)*sstep(r*7.0,r*1.2,dv.y);
      float fn=fbm2(vec2(dv.x*8.0, dv.y*5.0+T*3.2));
      foam=max(foam, sat(wake*(fn*1.8-0.55)));
      foam=max(foam, sstep(r*1.30,r*0.98,length(dv))*0.5*(0.5+0.5*sin(length(dv)*60.0-T*7.0)));
    }
    return mix(c, vec3(0.88,0.92,0.92), foam*0.8);
  }
  vec3 alb; float rough=0.85;
  if(mid<1.5){
    float wet=sat(1.0-(p.y-WY)*3.0);
    alb=mix(vec3(0.070,0.095,0.042), vec3(0.155,0.195,0.072), sat(fbm2(p.xz*3.0)*1.3));
    alb=mix(alb, vec3(0.085,0.070,0.052), wet*0.7);
    alb=mix(alb, vec3(0.052,0.042,0.030), sat(0.5-fbm2(p.xz*1.2))*0.6);
  }
  else if(mid<4.5) alb=vec3(0.125,0.19,0.065);
  else if(mid<5.5){alb=vec3(0.13,0.125,0.115)*(0.8+0.4*fbm3(p*9.0)); rough=0.5;}
  else if(mid<6.5) alb=vec3(0.080,0.066,0.052);
  else if(mid<7.5) alb=vec3(0.050,0.098,0.038);
  else if(mid<20.5)alb=vec3(0.11,0.12,0.16);
  else if(mid<21.5){alb=vec3(0.44,0.305,0.255); rough=0.6;}
  else if(mid<22.5)alb=vec3(0.050,0.038,0.032);
  else            {alb=vec3(0.030,0.028,0.030); rough=0.25;}
  float sh=SHAD(p+n*0.03,L,6.0,10.0);
  vec3 c=lamb(alb,n,L,LC,mix(0.18,1.0,sh));
  c+=spec(n,L,v,LC,rough,0.06,sh);
  c+=alb*SKY(normalize(n+vec3(0.0,0.8,0.0)))*0.40*AO(p,n);
  return c;
}
vec3 VOL(vec3 ro, vec3 rd, float tmax){
  vec3 col=vec3(1.20,1.02,0.62)*pow(sat(dot(rd,sunC())),9.0)*0.10;
  float t=1.0;
  for(int i=0;i<10;i++){
    if(t>tmax) break;
    vec3 q=ro+rd*t;
    col+=vec3(1.1,1.0,0.65)*sat(fbm2(q.xz*0.9+vec2(T*0.02,0.0))*1.6-0.88)*0.006;

float curtain(vec3 rd, float off, float sp, float amp, float sharp){
  float az=atan(rd.x,-rd.z);
  float x=az*1.6+off;
  float base=0.10+amp*(0.55*sin(x*1.5+T*sp)+0.28*sin(x*3.3-T*sp*0.9)+0.30*fbm2(vec2(x*1.2,T*0.03)));
  float dy=rd.y-base;
  float body=exp(-dy*dy*sharp);
  float up=sat(1.0-dy*2.4)*sat(dy*7.0+0.85);
  float strand=0.30+1.0*fbm2(vec2(x*22.0, rd.y*2.6-T*0.28));
  float env=0.20+0.95*fbm2(vec2(x*0.5+off,5.0));

const progs={};
function mkShader(type,src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    const log=gl.getShaderInfoLog(s);
    console.error('shaderfout:',log);
    const m=/:(\d+):/.exec(log||'');
    if(m){ const ln=+m[1];
      console.error(src.split('\n').slice(Math.max(0,ln-4),ln+3).map((l,i)=>(Math.max(1,ln-3)+i)+': '+l).join('\n')); }
    return null;
  }
  return s;
}
function getProg(key){
  if(progs[key]) return progs[key];
  const src=(GL2?HEAD2:HEAD1)+LIB+SH[key]+TAIL;
  const vs=mkShader(gl.VERTEX_SHADER, GL2?VS2:VS1);
  const fs=mkShader(gl.FRAGMENT_SHADER, src);
  if(!vs||!fs){ progs[key]={bad:true}; return progs[key]; }
  const pr=gl.createProgram(); gl.attachShader(pr,vs); gl.attachShader(pr,fs);
  gl.bindAttribLocation(pr,0,'a'); gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){ console.error('linkfout:',gl.getProgramInfoLog(pr)); progs[key]={bad:true}; return progs[key]; }
  const u={}; for(const nm of ['R','T','S','P','MO','AL','FOV','ROLL','CP','CT']) u[nm]=gl.getUniformLocation(pr,nm);
  progs[key]={prog:pr,u}; return progs[key];
}

const ease=u=>u*u*(3.0-2.0*u);
function nz(t,s){
  return Math.sin(t*1.7+s*13.1)*0.5+Math.sin(t*0.73+s*7.7)*0.35+Math.sin(t*2.9+s*3.3)*0.15;
}
function camFor(sc, local, gt){
  let sh=sc.shots[sc.shots.length-1];
  for(const s of sc.shots){ if(local>=s.t0 && local<s.t1){ sh=s; break; } }
  const u=Math.min(1,Math.max(0,(local-sh.t0)/(sh.t1-sh.t0)));
  const e=ease(u);
  const pos=[0,0,0], tgt=[0,0,0];
  for(let i=0;i<3;i++){
    pos[i]=sh.from[i]+(sh.to[i]-sh.from[i])*e;
    tgt[i]=sh.la[i]+(sh.lb[i]-sh.la[i])*e;
  }
  const k=(sh.shake||0.5)*0.014;
  pos[0]+=nz(gt*0.9,1)*k; pos[1]+=nz(gt*1.1,2)*k*0.8; pos[2]+=nz(gt*0.8,3)*k;
  tgt[0]+=nz(gt*0.7,4)*k*1.7; tgt[1]+=nz(gt*0.85,5)*k*1.3;
  const roll=nz(gt*0.45,6)*(sh.shake||0.5)*0.005;
  return {pos,tgt,fov:sh.fov,roll};
}

  if(!AC||!sndOn||!nodes) return;
  const p=PROF[k]||[0.1,0,0.4,0.2], tt=AC.currentTime;
  nodes.wind.gain.setTargetAtTime(p[0]*0.32,tt,2.5);
  nodes.water.gain.setTargetAtTime(p[1]*0.32,tt,2.5);
  nodes.room.gain.setTargetAtTime(p[2]*0.24,tt,2.5);
  nodes.pad.gain.setTargetAtTime(p[3]*0.20,tt,4.0);
}

/* ---------------- 8. bediening ---------------- */
let hudTimer=null;
function showHud(){ hud.classList.add('on'); clearTimeout(hudTimer);
  hudTimer=setTimeout(()=>hud.classList.remove('on'),2600); }
addEventListener('mousemove',showHud);
addEventListener('touchstart',showHud,{passive:true});

bplay.onclick=toggle;
document.getElementById('bback').onclick=()=>seek(t-15);
document.getElementById('bfwd').onclick=()=>seek(t+15);
const bspeed=document.getElementById('bspeed');
bspeed.onclick=()=>{ speed=speed===1?2:(speed===2?8:1); bspeed.textContent=speed+'×'; };
document.getElementById('bchap').onclick=()=>chapsEl.classList.toggle('on');
chapsEl.onclick=e=>{ if(e.target===chapsEl) chapsEl.classList.remove('on'); };
const bcap=document.getElementById('bcap');
bcap.onclick=()=>{ capsOn=!capsOn; bcap.style.opacity=capsOn?1:.45; if(!capsOn) capEl.classList.remove('show'); else curCue=null; };
const bsnd=document.getElementById('bsnd');
bsnd.onclick=()=>{ sndOn=!sndOn; bsnd.style.opacity=sndOn?1:.45;
  if(sndOn){ initAudio(); AC.resume(); audioProfile(SCENES[sceneAt(t)].key); }
  else if(nodes){ const tt=AC.currentTime; [nodes.wind,nodes.water,nodes.room,nodes.pad].forEach(n=>n.gain.setTargetAtTime(0,tt,0.5)); } };
bsnd.style.opacity=.45;
const bq=document.getElementById('bq');
bq.onclick=()=>{ quality=quality===0.60?0.80:(quality===0.80?1.0:0.45);
  bq.textContent='Kwaliteit '+Math.round(quality*100)+'%'; resize(); };
document.getElementById('bfs').onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };

document.getElementById('bstart').onclick=()=>{
  started=true; playing=true; bplay.textContent='❚❚';
  gate.classList.add('off');
  sndOn=true; bsnd.style.opacity=1; initAudio(); AC.resume(); audioProfile(SCENES[0].key);
  setTimeout(()=>gate.style.display='none',1300);
  showHud();
};
addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); if(started) toggle(); else document.getElementById('bstart').click(); showHud(); }
  else if(e.code==='ArrowRight'){ seek(t+15); showHud(); }
  else if(e.code==='ArrowLeft'){ seek(t-15); showHud(); }
  else if(e.key==='1'){ speed=1; bspeed.textContent='1×'; showHud(); }
  else if(e.key==='2'){ speed=2; bspeed.textContent='2×'; showHud(); }
  else if(e.key==='3'){ speed=8; bspeed.textContent='8×'; showHud(); }
  else if(e.key==='m'){ chapsEl.classList.toggle('on'); }
  else if(e.key==='c'){ bcap.click(); }
  else if(e.key==='f'){ document.getElementById('bfs').click(); }
  else if(e.key==='Escape'){ chapsEl.classList.remove('on'); }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&playing) toggle(); });

resize(); update();
window.__player={ seek, get t(){return t;}, TOTAL, SCENES, start:()=>document.getElementById('bstart').click(),
  setQ:q=>{ quality=q; resize(); } };
</script>
